<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<script>


 var language = navigator.language || navigator.browserLanguage;



	if (language.indexOf('it') > -1) {
document.location.href = '/it/';
}
else if (language.indexOf('fr') > -1) {
        document.location.href = '/fr/';
}
else if (language.indexOf('de') > -1) {
        document.location.href = '/de/';
    }
    else if (language.indexOf('es') > -1) {
        document.location.href = '/es/';
    }
 else {
        document.location.href = '/en/';
}



</script>


</head>

</body>
</html>
