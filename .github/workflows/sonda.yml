# Reads producer web pages (sonda/urls.txt) from GitHub, to find their official data-sheet PDFs.
name: Sonda siti produttori
on:
  push:
    branches: [sonda]
    paths: [sonda/urls.txt]
permissions:
  contents: write
jobs:
  leggi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p sonda/out; rm -f sonda/out/*; i=0
          while read -r url; do
            [ -z "$url" ] && continue; i=$((i+1))
            code=$(curl -sSL -m 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o sonda/out/$i.html -w '%{http_code}' "$url" || true)
            echo "$i $code $(stat -c %s sonda/out/$i.html 2>/dev/null) $url" >> sonda/out/esito.txt
          done < sonda/urls.txt
          cat sonda/out/esito.txt
          git config user.name "github-actions[bot]"; git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add sonda/out; git commit -qm "Sonda" || exit 0; git push
